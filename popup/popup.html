<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Reader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <section class="settings" aria-labelledby="settings-title">
        <div class="primary-setting">
          <h1 id="settings-title">视觉分块</h1>
          <label class="switch" title="开启或关闭视觉分块">
            <input id="enabled" type="checkbox" role="switch" aria-label="开启视觉分块">
            <span class="slider"></span>
          </label>
        </div>

        <div class="controls">
          <label class="range-label" for="divider-width">
            <span>粗细</span>
            <output id="divider-output" for="divider-width">3 px</output>
          </label>
          <input id="divider-width" type="range" min="1" max="5" step="1" value="3">

          <fieldset class="color-picker">
            <legend>颜色</legend>
            <div class="color-options">
              <label class="color-option" title="红色">
                <input type="radio" name="divider-color" value="red" checked aria-label="红色">
                <span class="color-swatch color-swatch--red" aria-hidden="true"></span>
              </label>
              <label class="color-option" title="黄色">
                <input type="radio" name="divider-color" value="yellow" aria-label="黄色">
                <span class="color-swatch color-swatch--yellow" aria-hidden="true"></span>
              </label>
              <label class="color-option" title="蓝色">
                <input type="radio" name="divider-color" value="blue" aria-label="蓝色">
                <span class="color-swatch color-swatch--blue" aria-hidden="true"></span>
              </label>
              <label class="color-option" title="绿色">
                <input type="radio" name="divider-color" value="green" aria-label="绿色">
                <span class="color-swatch color-swatch--green" aria-hidden="true"></span>
              </label>
              <label class="color-option" title="跟随文字颜色">
                <input type="radio" name="divider-color" value="text" aria-label="跟随文字颜色">
                <span class="color-swatch color-swatch--text" aria-hidden="true"></span>
              </label>
            </div>
          </fieldset>
        </div>

        <div class="preview" aria-label="效果预览" aria-live="polite">将长句切分成短句加速阅读理解</div>
      </section>

      <p id="page-status" class="status" role="status" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
