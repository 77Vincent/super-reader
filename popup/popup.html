<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Reader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="logo" aria-hidden="true"><span>阅</span></div>
        <div>
          <h1>Super Reader</h1>
          <p>中文视觉分块阅读</p>
        </div>
      </header>

      <section class="switch-card">
        <div>
          <strong>阅读辅助</strong>
          <span id="switch-state">已关闭</span>
        </div>
        <label class="switch">
          <input id="enabled" type="checkbox" aria-label="开启阅读辅助">
          <span class="slider"></span>
        </label>
      </section>

      <section class="settings" aria-label="效果预览">
        <div class="preview" aria-label="效果预览">
          <span class="preview-a">今天</span><span class="preview-b">下雨了</span>。<span class="preview-a">我们明天再出发</span>！
        </div>
      </section>

      <p id="page-status" class="status" role="status">设置会应用到所有普通网页</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
