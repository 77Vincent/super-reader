<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Super Reader 浏览器测试</title>
    <link rel="stylesheet" href="../src/content.css">
    <style>body { max-width: 720px; margin: 48px auto; font: 20px/2 system-ui; }</style>
  </head>
  <body>
    <button id="toggle" type="button">开启</button>
    <p id="sample">我一直在思考明天早上的早餐吃什么</p>
    <p id="inline-sample">这里的<strong>加粗内容需要保留原来的标签</strong>，后面的文字也应该可以正常阅读。</p>
    <pre><code id="ignored">代码区域的中文内容应该保持原样。</code></pre>
    <script>
      // A button stands in for the toolbar. The real inference service and
      // Worker run here instead of in an offscreen page.
      const fixtureListeners = [];
      const fixtureSender = { id: "test-extension", tab: { id: 1 } };
      const fixtureToggle = document.querySelector("#toggle");

      function renderFixtureState(state) {
        fixtureToggle.disabled = state.busy;
        fixtureToggle.textContent = state.error ? "出错，点击重试" : state.busy ? "处理中" : state.enabled ? "关闭" : "开启";
        document.body.dataset.enabled = String(state.enabled);
        document.body.dataset.busy = String(state.busy);
      }
      function fixtureMessage(message) {
        return new Promise((resolve) => {
          fixtureListeners.forEach((listener) => listener(message, fixtureSender, resolve));
        });
      }
      window.chrome ||= {};
      window.chrome.runtime = {
        id: fixtureSender.id,
        getURL: (path) => new URL(`../${path}`, location.href).href,
        onMessage: { addListener: (listener) => fixtureListeners.push(listener) },
        async sendMessage(message) {
          if (message.type === "SUPER_READER_STATE") {
            renderFixtureState(message);
            return {};
          }
          return fixtureMessage({ ...message, target: "offscreen", type: "SUPER_READER_RUN_INFERENCE" });
        },
      };
      fixtureToggle.addEventListener("click", async () => {
        renderFixtureState(await fixtureMessage({ type: "SUPER_READER_TOGGLE" }));
      });
    </script>
    <script src="../src/inference-service.js"></script>
    <script src="../src/content.js"></script>
  </body>
</html>
