<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Reader context lifetime regression</title>
<link rel="stylesheet" href="../src/content.css">
<button id="run">Test context invalidation</button>
<p id="sample">这是用于验证扩展上下文失效后停止监听的中文文字</p>
<pre id="result">Simulates host invalidation with native viewport events; does not reload Chrome extensions.</pre>
<script src="../src/frontend/dom-tree.js"></script>
<script src="../src/frontend/viewport.js"></script>
<script src="../src/frontend/visibility.js"></script>
<script src="../src/frontend/processed-text.js"></script>
<script src="../src/frontend/read.js"></script>
<script src="../src/frontend/write.js"></script>
<script src="../src/app/reader.js"></script>
<script>
  let receiveMessage;
  let requests = 0;
  const states = [];
  // Exercise the actual Chrome adapter and startup against an invalidatable host.
  globalThis.chrome = { runtime: {
    id: "test-extension",
    getURL: () => new URL("../src/content.css", location.href).href,
    onMessage: { addListener(callback) { receiveMessage = callback; } },
    async sendMessage(message) {
      if (message.type === "SUPER_READER_STATE") { states.push(message); return {}; }
      requests += 1;
      return { offsetsByText: message.texts.map(() => [2]) };
    },
  } };
</script>
<script src="../src/platform/chrome/content.js"></script>
<script src="../src/start-reader.js"></script>
<script>
  document.querySelector("#run").addEventListener("click", async (event) => {
    event.target.disabled = true;
    const errors = [];
    const onError = (event) => { errors.push(event.message); event.preventDefault(); };
    window.addEventListener("error", onError);
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const sample = document.querySelector("#sample");
    const original = sample.textContent;
    try {
      receiveMessage({ type: "SUPER_READER_TOGGLE" }, {}, () => {});
      await delay(30);
      assert(document.querySelectorAll(".super-reader-divider").length === 1, "initial markers missing");
      const stateCount = states.length;
      chrome.runtime.id = undefined;
      const added = document.createElement("div");
      added.textContent = "上下文失效后不能读取这段文字";
      Object.defineProperty(added, "matches", {
        get() { throw new Error("obsolete callback inspected a new DOM node"); },
      });
      sample.after(added);
      window.dispatchEvent(new Event("scroll"));
      await delay(30);
      assert(errors.length === 0, errors.join("; "));
      assert(document.querySelectorAll(".super-reader-divider").length === 0, "markers survived teardown");
      assert(sample.textContent === original && sample.childNodes.length === 1, "text was not restored");
      window.dispatchEvent(new Event("scroll"));
      window.dispatchEvent(new Event("resize"));
      sample.append("后续变化也不能重启旧实例");
      await delay(250);
      assert(errors.length === 0, errors.join("; "));
      assert(requests === 1 && states.length === stateCount, "obsolete reader continued processing or publishing");
      let status;
      receiveMessage({ type: "SUPER_READER_TOGGLE" }, {}, (value) => { status = value; });
      assert(!status.enabled && !status.busy, "obsolete reader restarted");
      document.querySelector("#result").textContent = "PASS: viewport callback stopped before DOM inspection; markers restored; later mutations, scrolling, resizing and toggling remained inert.";
    } catch (error) {
      document.querySelector("#result").textContent = `FAIL: ${error.message}`;
    } finally { window.removeEventListener("error", onError); }
  });
</script>
</html>
