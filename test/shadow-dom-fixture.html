<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="super-reader" content="off">
<title>Shadow DOM regression tests</title>
<link rel="stylesheet" href="../src/content.css">
<style>
  body { font: 16px/1.5 sans-serif; margin: 16px; }
  #fixture { position: fixed; top: 60px; left: 16px; width: 600px; }
  #results { position: relative; margin-top: 430px; white-space: pre-wrap; }
</style>
<button id="run">Run shadow DOM tests</button>
<div id="fixture"></div>
<pre id="results">Not run</pre>
<script src="../src/frontend/dom-tree.js"></script>
<script src="../src/frontend/viewport.js"></script>
<script src="../src/frontend/visibility.js"></script>
<script src="../src/frontend/processed-text.js"></script>
<script src="../src/frontend/read.js"></script>
<script src="../src/frontend/write.js"></script>
<script src="../src/frontend/content-changes.js"></script>
<script src="../src/app/reader.js"></script>
<script>
  let reader;
  let inputs = [];
  let states = [];
  let processInput = async (texts) => texts.map(() => [2]);
  SuperReader.createReaderAdapter = () => ({
    markerStyleUrl: new URL("../src/content.css", location.href).href,
    async process(texts) { inputs.push([...texts]); return processInput(texts); },
    publishState(state) { states.push(state); },
    connect(instance) { reader = instance; },
  });
</script>
<script src="../src/start-reader.js"></script>
<script>
  const fixture = document.querySelector("#fixture");
  const output = document.querySelector("#results");
  const tests = [];
  const test = (name, run) => tests.push({ name, run });
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  async function until(condition, message) {
    const deadline = performance.now() + 5000;
    while (!condition()) {
      if (performance.now() > deadline) throw new Error(message);
      await delay(20);
    }
  }
  const markers = (root) => root.querySelectorAll(".super-reader-divider");
  const resize = () => window.dispatchEvent(new Event("resize"));
  function shadow(parent = fixture) {
    const host = document.createElement("div");
    parent.append(host);
    return host.attachShadow({ mode: "open" });
  }
  function paragraph(parent, value = "这是一条需要处理的评论文字") {
    const p = document.createElement("p");
    p.textContent = value;
    parent.append(p);
    return p;
  }
  async function enable() {
    reader.toggle(true);
    await until(() => !reader.status().busy, "initial operation did not finish");
    assert(reader.status().enabled, reader.status().error);
  }

  test("replacing a processed title with identical text restores markers without any size or viewport change", async () => {
    const p = paragraph(fixture, "精灵6号和小米SU7，谁才是年轻人的驾驶者之车");
    const original = p.textContent;
    await enable();
    assert(markers(p).length === 1 && inputs.length === 1, "initial title was not processed");
    const height = document.body.getBoundingClientRect().height;
    p.textContent = original;
    assert(markers(p).length === 0, "page replacement did not remove the original marker");
    assert(document.body.getBoundingClientRect().height === height, "test changed the body size");
    await until(() => inputs.length === 2 && markers(p).length === 1, "replacement title was not processed automatically");
    assert(p.textContent === original && reader.status().enabled, "title or enabled state changed");
    assert(inputs[1].length === 1 && inputs[1][0] === original, "replacement title was not captured intact");
    const stableStates = states.length;
    await delay(500);
    assert(states.length === stableStates && inputs.length === 2, "marker insertion caused a refresh loop");
  });

  test("a YouTube-style title rewrite removes a stranded leading divider automatically", async () => {
    const title = "我的数学家朋友集体破防AI又双叒叕来毁灭人类了？";
    const p = paragraph(fixture, title);
    const other = paragraph(fixture);
    await enable();
    const stableMarker = markers(other)[0];
    const [left, divider, right] = p.childNodes;
    left.remove();
    right.nodeValue = "AI又双叒叕来毁灭人类了？";
    right.before(document.createTextNode("我的数学家朋友集体破防"));
    assert(p.firstChild === divider, "did not reproduce the leading divider");
    processInput = async (texts) => texts.map(() => []);
    await until(() => inputs.length === 2 && !reader.status().busy, "title edit did not trigger a refresh");
    assert(JSON.stringify(inputs[1]) === JSON.stringify(["我的数学家朋友集体破防"]), "new prefix was not read independently of the adopted fragment");
    assert(markers(p).length === 0 && p.textContent === title, "stale divider or changed title remains");
    assert(markers(other)[0] === stableMarker, "unrelated markers were replaced");
    const count = states.length;
    await delay(500);
    assert(states.length === count, "cleanup caused a mutation feedback loop");
  });

  test("clearing a shadow anchor discards all old derived text", async () => {
    const root = shadow();
    const p = paragraph(root);
    await enable();
    const anchor = p.firstChild;
    processInput = async (texts) => texts.map(() => []);
    p.firstChild.nodeValue = "";
    await until(() => markers(p).length === 0 && !reader.status().busy, "empty anchor was ignored");
    assert(inputs.length === 1, "old tail was incorrectly sent for inference");
    assert(p.textContent === "" && p.childNodes.length === 1 && p.firstChild === anchor, "clearing did not preserve the empty anchor");
  });

  test("nested comments render with their own stylesheet and fully restore on disable", async () => {
    const outer = shadow();
    const inner = shadow(shadow(outer));
    const p = paragraph(inner);
    const original = p.textContent;
    const bold = document.createElement("b");
    bold.textContent = "加粗评论文字";
    p.append(bold);
    const fullText = p.textContent;
    await enable();
    assert(inputs.length === 1 && inputs[0][0] === original, "nested comment was missed");
    assert(markers(inner).length === 2, "expected both original text nodes");
    assert(p.textContent === fullText && p.contains(bold), "markup or text was changed");
    await until(() => getComputedStyle(markers(inner)[0], "::before").borderInlineStartWidth === "3px", "shadow marker stylesheet did not load");
    const stableStates = states.length;
    await delay(500);
    assert(states.length === stableStates && inputs.length === 1, "marker writes caused a feedback refresh");
    reader.toggle(false);
    assert(markers(inner).length === 0 && !inner.querySelector("link"), "shadow artifacts survived disable");
    assert(p.textContent === fullText && p.firstChild.nodeValue === original, "text was not restored");
    await enable();
    assert(inputs.length === 2 && markers(inner).length === 2, "processed records did not reset");
  });

  test("removing links and image-map areas never treats a URL host as a DOM parent", async () => {
    const errors = [];
    const onError = (event) => { errors.push(event.message); event.preventDefault(); };
    window.addEventListener("error", onError);
    try {
      const link = document.createElement("a");
      link.href = "https://news.example.test/article";
      link.textContent = "随后被页面移除的新闻链接";
      const area = document.createElement("area");
      area.href = "https://news.example.test/image";
      fixture.append(link, area);
      await enable();
      assert(markers(link).length === 1, "initial link was not processed");
      link.remove();
      area.remove();
      const next = paragraph(fixture, "链接更新之后新增的新闻文字");
      await delay(30);
      assert(errors.length === 0, errors.join("; "));
      await until(() => markers(next).length === 1, "replacement link text was not processed");
      assert(SuperReader.parentElementAcrossRoots(link) === null, "detached anchor acquired a false parent");
      assert(SuperReader.parentElementAcrossRoots(area) === null, "detached area acquired a false parent");
    } finally { window.removeEventListener("error", onError); }
  });

  test("direct shadow text and slotted text are captured once; unslotted text stays excluded", async () => {
    const root = shadow();
    root.append(document.createTextNode("直接位于影子根的中文文字"));
    const slot = document.createElement("slot");
    slot.name = "comment";
    slot.textContent = "不应显示的回退文字";
    root.append(slot);
    const assigned = paragraph(root.host, "插槽中的可见评论文字");
    assigned.slot = "comment";
    paragraph(root.host, "没有分配插槽的隐藏文字");
    await enable();
    assert(JSON.stringify(inputs[0]) === JSON.stringify(["直接位于影子根的中文文字", "插槽中的可见评论文字"]), `unexpected input: ${JSON.stringify(inputs)}`);
    assert(markers(root).length === 1 && markers(root.host).length === 1, "direct or slotted text did not render");
  });

  test("hidden hosts and host overflow constrain shadow text; resize discovers revealed content", async () => {
    const hidden = shadow();
    hidden.host.hidden = true;
    paragraph(hidden, "隐藏的评论随后显示");
    const clipped = shadow();
    clipped.host.style.cssText = "height:30px;overflow:hidden";
    const p = paragraph(clipped, "被容器完全裁掉的评论");
    p.style.marginTop = "200px";
    await enable();
    assert(inputs.length === 0, "hidden or clipped comments were processed");
    hidden.host.hidden = false;
    resize();
    await until(() => markers(hidden).length === 1, "revealed shadow root was not discovered");
    assert(inputs.length === 1 && inputs[0][0] === "隐藏的评论随后显示", "wrong revealed input");
  });

  test("late comments and text changes are processed without a viewport event", async () => {
    const root = shadow();
    await enable();
    assert(inputs.length === 0, "expected empty initial snapshot");
    const inner = shadow(root);
    const p = paragraph(inner, "后来加载进来的评论文字");
    await until(() => markers(inner).length === 1, "late nested comments were missed");
    p.textContent = "服务器更新之后的新评论文字";
    await until(() => inputs.length === 2 && markers(inner).length === 1, "replacement comment was missed");
    const unchangedFragment = p.firstChild;
    const changedText = "直接修改现有文本节点的评论";
    unchangedFragment.nodeValue = changedText;
    await until(() => inputs.length === 3 && !reader.status().busy, "characterData change was missed");
    assert(inputs[2][0] === changedText, "old derived text contaminated the new input");
    assert(p.textContent === changedText && p.firstChild === unchangedFragment && markers(p).length === 1, "old tail remains or original anchor was replaced");
    await delay(450);
    assert(inputs.length === 3, "comment updates kept repeating");
  });

  test("a page observer changing rendered text cannot mark new text as already processed", async () => {
    const root = shadow();
    const p = paragraph(root);
    const updated = "页面观察到标记后自行更新的评论文字";
    const pageObserver = new MutationObserver(() => {
      pageObserver.disconnect();
      p.firstChild.nodeValue = updated;
    });
    pageObserver.observe(p, { childList: true });
    try {
      await enable();
      await until(() => inputs.length === 2 && !reader.status().busy, "page update was incorrectly remembered as processed");
      assert(inputs[1][0] === updated, "old derived text contaminated the observer's update");
      assert(p.textContent === updated && markers(p).length === 1, "page content or split count changed");
    } finally { pageObserver.disconnect(); }
  });

  test("same-value anchor writes remove old tails in ordinary and shadow DOM", async () => {
    const ordinary = paragraph(fixture, "普通页面原始文字");
    const nested = paragraph(shadow(), "影子根中原始文字");
    const anchors = [ordinary.firstChild, nested.firstChild];
    await enable();
    processInput = async (texts) => texts.map(() => []);
    anchors.forEach((anchor) => { anchor.nodeValue = anchor.nodeValue; });
    await until(() => inputs.length === 2 && !reader.status().busy, "same-value writes were not tracked");
    assert(JSON.stringify(inputs[1]) === JSON.stringify(["普通", "影子"]), "same-value updates retained stale tails");
    [ordinary, nested].forEach((p, index) => {
      assert(p.childNodes.length === 1 && p.firstChild === anchors[index], "anchor identity changed");
    });
  });

  test("OFF flushes same-value writes before disconnecting the content observer", async () => {
    const p = paragraph(shadow(), "立即关闭之前原始文字");
    const anchor = p.firstChild;
    await enable();
    anchor.nodeValue = "立即";
    reader.toggle(false); // Same task: the browser has not delivered the mutation yet.
    assert(p.childNodes.length === 1 && p.firstChild === anchor && p.textContent === "立即", "OFF restored an obsolete tail");
  });

  test("unwrite retains separate adjacent Text nodes and empty anchors", async () => {
    const p = paragraph(shadow(), "第一个独立原始节点");
    const first = p.firstChild;
    const empty = document.createTextNode("");
    const second = document.createTextNode("第二个独立原始节点");
    p.append(empty, second);
    await enable();
    reader.toggle(false);
    assert(p.childNodes.length === 3 && p.childNodes[0] === first && p.childNodes[1] === empty && p.childNodes[2] === second, "original node identities or boundaries were lost");
    assert(first.nodeValue === "第一个独立原始节点" && second.nodeValue === "第二个独立原始节点", "original text was not restored");
  });

  test("page-adopted derived text is preserved and paused until another edit", async () => {
    const p = paragraph(shadow(), "原文里的后半段不能被错误删除");
    await enable();
    const anchor = p.firstChild;
    const tail = p.lastChild;
    tail.nodeValue = "网页接管后的新文字";
    await until(() => markers(p).length === 0 && !reader.status().busy, "conflicted markers were not cleared");
    assert(p.childNodes.length === 2 && p.firstChild === anchor && p.lastChild === tail, "adopted fragment was removed or merged");
    assert(p.textContent === "原文网页接管后的新文字" && inputs.length === 1, "conflicted text was changed or immediately split again");
    tail.nodeValue = "再次更新后的独立文字";
    await until(() => inputs.length === 2 && !reader.status().busy, "later page edit did not resume processing");
    assert(inputs[1][0] === "再次更新后的独立文字", "wrong resumed text");
  });

  test("content changes during inference wait and coalesce into the latest comment", async () => {
    const root = shadow();
    const p = paragraph(root, "开始处理时捕获的评论文字");
    let finish;
    processInput = (texts) => inputs.length === 1
      ? new Promise((resolve) => { finish = () => resolve(texts.map(() => [2])); })
      : Promise.resolve(texts.map(() => [2]));
    reader.toggle(true);
    try {
      p.firstChild.nodeValue = "变化过程中的中间评论文字";
      await delay(240);
      p.firstChild.nodeValue = "最后一次更新之后的评论文字";
      await delay(240);
      assert(inputs.length === 1 && reader.status().busy, "started a concurrent operation");
      finish();
      await until(() => inputs.length === 2 && !reader.status().busy, "pending refresh never ran");
      assert(inputs[1][0] === "最后一次更新之后的评论文字", "processed an intermediate snapshot");
      assert(markers(root).length === 1, "stale results were rendered");
    } finally { finish?.(); await delay(30); }
  });

  test("shadow-internal scrolling waits for a window viewport event", async () => {
    const root = shadow();
    const scroller = document.createElement("div");
    scroller.style.cssText = "height:65px;overflow:auto";
    root.append(scroller);
    paragraph(scroller, "第一屏可见的评论文字");
    const spacer = document.createElement("div");
    spacer.style.height = "300px";
    scroller.append(spacer);
    paragraph(scroller, "内部滚动后可见的评论文字");
    await enable();
    assert(inputs[0].length === 1, "offscreen comment was captured");
    scroller.scrollTop = scroller.scrollHeight;
    await delay(250);
    assert(inputs.length === 1, "reader unexpectedly subscribed to shadow-internal scrolling");
    resize();
    await until(() => inputs.length === 2 && !reader.status().busy, "resize missed the scrolled shadow content");
    assert(inputs[1][0] === "内部滚动后可见的评论文字", "wrong scroll input");
    scroller.scrollTop = 0;
    await delay(450);
    assert(inputs.length === 2, "earlier comments were processed again");
  });

  test("disable clears detached roots and stops viewport refreshes", async () => {
    const root = shadow();
    const p = paragraph(root);
    const original = p.textContent;
    await enable();
    root.host.remove();
    reader.toggle(false);
    assert(markers(root).length === 0 && !root.querySelector("link"), "detached root was not cleaned");
    assert(p.textContent === original && p.childNodes.length === 1, "detached text was not restored");
    const count = states.length;
    fixture.append(root.host);
    paragraph(root, "关闭以后增加的评论文字");
    resize();
    await delay(450);
    assert(states.length === count, "disabled reader still reacted to changes");
  });

  document.querySelector("#run").addEventListener("click", async (event) => {
    event.currentTarget.disabled = true;
    output.textContent = "Running";
    const results = [];
    for (const { name, run } of tests) {
      inputs = []; states = [];
      processInput = async (texts) => texts.map(() => [2]);
      fixture.replaceChildren();
      try { await run(); results.push(`PASS ${name}`); }
      catch (error) { results.push(`FAIL ${name}: ${error.message}`); }
      if (reader.status().enabled && !reader.status().busy) reader.toggle(false);
    }
    fixture.replaceChildren();
    output.textContent = `${results.filter((line) => line.startsWith("PASS")).length}/${tests.length} passed\n${results.join("\n")}`;
    document.querySelector("#run").disabled = false;
  });
</script>
</html>
