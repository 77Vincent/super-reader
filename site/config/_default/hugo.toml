# 发布前替换为正式地址；子路径也要包含在内，并保留末尾斜杠。
baseURL = 'https://example.org/'
title = '好读'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']
disableHugoGeneratorInject = true

[outputs]
  home = ['HTML']

[build.buildStats]
  enable = true

[module.hugoVersion]
  min = '0.158.0'
  extended = true
