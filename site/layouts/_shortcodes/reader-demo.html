{{- $id := printf "reader-demo-%d" .Ordinal -}}
<div class="reader-demo border rounded p-4 my-4" data-reader-demo>
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
    <button type="button" class="btn btn-outline-primary btn-sm rounded-pill"
      data-reader-demo-toggle aria-pressed="true" aria-controls="{{ $id }}" hidden>隐藏分隔线</button>
  </div>
  <div id="{{ $id }}" class="reader-demo-text">
    {{- $content := .Page.RenderString (dict "display" "block") .Inner -}}
    {{- replace $content "｜" `<span class="reader-divider" aria-hidden="true"></span>` | safeHTML -}}
  </div>
</div>
