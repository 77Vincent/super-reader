{{- $id := printf "reader-demo-%d" .Ordinal -}}
<div class="my-4" data-reader-demo>
  <div id="{{ $id }}" class="reader-demo-paper bg-body-tertiary p-3 p-md-4">
    {{- $content := .Page.RenderString (dict "display" "block") .Inner -}}
    {{- replace $content "｜" `<span class="reader-divider" aria-hidden="true"></span>` | safeHTML -}}
  </div>

  <div class="d-flex justify-content-center mt-3">
    <button type="button" class="btn btn-outline-primary rounded-pill"
      data-reader-demo-toggle aria-pressed="true" aria-controls="{{ $id }}" hidden>关闭阅读辅助</button>
  </div>
</div>
