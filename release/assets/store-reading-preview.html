<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>好读</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; color: #192b33; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { height: 84px; padding: 24px 64px; display: flex; align-items: center; gap: 24px; background: white; border-bottom: 1px solid #e8ebee; }
    .brand { white-space: nowrap; font-size: 29px; font-weight: 600; }
    /* Keep the logo geometry identical to the site's .brand-divider. */
    .brand i { display: inline-block; width: calc(1em / 6); height: 1em; margin: 0 0.08em; background: #ff1744; vertical-align: -0.15em; }
    main { width: 960px; margin: 46px auto; }
    h1 { margin: 0 0 12px; font-size: 36px; font-weight: 600; }
    .intro { margin: 0 0 30px; color: #687880; font-size: 18px; }
    article { padding: 34px 40px; background: white; border: 1px solid #e8ebee; border-radius: 8px; }
    article p { margin: 0 0 22px; font-size: 23px; line-height: 2; }
    article p:last-child { margin-bottom: 0; }
    footer { margin-top: 25px; color: #687880; font-size: 16px; }
  </style>
</head>
<body>
  <!-- This page contains no reader code or hand-inserted text dividers.
       Capture it only after the actual extension has processed the paragraphs. -->
  <header><div class="brand" aria-label="好读">好<i></i>读</div></header>
  <main>
    <h1>让长句更容易阅读</h1>
    <p class="intro">阅读示例</p>
    <article>
      <p>读一篇文章时，我们常常需要在很长的句子里找到关键的信息。如果文字能够在适当的位置稍作停顿，理解作者想要表达的意思就会轻松一些。</p>
      <p>好读使用浏览器内运行的神经网络，在中文长句中添加细小的分隔线。这些标记帮助我们看清句子的语意结构，同时保留网页原有的文字内容。</p>
      <p>当你不需要阅读辅助时，只要再次点击工具栏里的好读图标，就可以恢复原来的阅读方式。网页正文始终留在本机，无需发送到外部服务。</p>
    </article>
    <footer>本地运行 · 保留原文 · 随时开关</footer>
  </main>
</body>
</html>
