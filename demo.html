<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Super Reader 中文视觉分块阅读 Chrome 扩展交互演示">
    <title>Super Reader · 中文视觉分块阅读</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #697386;
        --paper: #f5f4ef;
        --card: rgba(255, 255, 255, 0.9);
        --line: rgba(23, 32, 51, 0.11);
        --accent: #6457ed;
        font-family:
          Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei",
          system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 88% 8%, rgba(100, 87, 237, 0.12), transparent 28rem),
          var(--paper);
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .shell {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        height: 68px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 11px;
        color: white;
        background: linear-gradient(145deg, #4f46e5, #7c3aed);
        box-shadow: 0 7px 18px rgba(79, 70, 229, 0.23);
        font-size: 17px;
        font-weight: 760;
      }

      .brand-name {
        font-size: 15px;
        font-weight: 760;
        letter-spacing: -0.02em;
      }

      .hero {
        padding: 62px 0 34px;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-size: clamp(38px, 5vw, 58px);
        font-weight: 760;
        letter-spacing: -0.055em;
        line-height: 1.12;
      }

      h1 em {
        position: relative;
        color: var(--accent);
        font-style: normal;
        white-space: nowrap;
      }

      .hero-copy {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .demo-section {
        padding: 0 0 72px;
      }

      .playground {
        display: grid;
        grid-template-columns: minmax(280px, 0.78fr) minmax(0, 1.22fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 24px 60px rgba(28, 35, 61, 0.08);
      }

      .controls {
        padding: 28px;
        border-right: 1px solid var(--line);
        background: rgba(248, 249, 252, 0.72);
      }

      .control-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }

      .control-top strong {
        display: block;
        font-size: 14px;
      }

      .switch {
        position: relative;
        width: 48px;
        height: 28px;
      }

      .switch input {
        position: absolute;
        opacity: 0;
      }

      .switch-track {
        position: absolute;
        inset: 0;
        cursor: pointer;
        border-radius: 999px;
        background: #cbd1dc;
        transition: 180ms ease;
      }

      .switch-track::after {
        position: absolute;
        width: 22px;
        height: 22px;
        top: 3px;
        left: 3px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 2px 7px rgba(23, 32, 51, 0.25);
        content: "";
        transition: 180ms ease;
      }

      .switch input:checked + .switch-track {
        background: var(--accent);
      }

      .switch input:checked + .switch-track::after {
        transform: translateX(20px);
      }

      .switch input:focus-visible + .switch-track {
        outline: 3px solid rgba(100, 87, 237, 0.22);
        outline-offset: 3px;
      }

      .field {
        margin-top: 24px;
      }

      .field-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 12px;
        font-weight: 700;
      }

      .field-label output {
        color: var(--accent);
      }

      input[type="range"] {
        width: 100%;
        margin: 0;
        accent-color: var(--accent);
      }

      .color-picker {
        min-width: 0;
        margin: 24px 0 0;
        padding: 0;
        border: 0;
      }

      .color-picker legend {
        margin-bottom: 11px;
        padding: 0;
        font-size: 12px;
        font-weight: 700;
      }

      .color-options {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      .color-option {
        position: relative;
        display: grid;
        cursor: pointer;
        gap: 6px;
        justify-items: center;
      }

      .color-option input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .color-option small {
        color: var(--muted);
        font-size: 10px;
      }

      .color-swatch {
        width: 30px;
        height: 30px;
        border: 2px solid white;
        border-radius: 50%;
        background: var(--swatch-color);
        box-shadow: 0 0 0 1px rgba(23, 32, 51, 0.18);
        transition: 140ms ease;
      }

      .color-swatch--red { --swatch-color: #ff1744; }
      .color-swatch--yellow { --swatch-color: #ffd600; }
      .color-swatch--blue { --swatch-color: #2979ff; }
      .color-swatch--green { --swatch-color: #00e676; }

      .color-swatch--text {
        display: grid;
        place-items: center;
        color: #263247;
        background: #eef1f6;
      }

      .color-swatch--text::before {
        content: "字";
        font-size: 12px;
        font-weight: 800;
      }

      .color-option input:checked + .color-swatch {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        transform: scale(0.92);
      }

      .color-option input:focus-visible + .color-swatch {
        outline: 3px solid rgba(100, 87, 237, 0.3);
        outline-offset: 3px;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 116px;
        resize: vertical;
        padding: 14px;
        border: 1px solid #dce0e8;
        border-radius: 13px;
        outline: none;
        color: #263247;
        background: white;
        font-size: 13px;
        line-height: 1.7;
        transition: 150ms ease;
      }

      textarea:focus {
        border-color: #938af2;
        box-shadow: 0 0 0 3px rgba(100, 87, 237, 0.12);
      }

      .reader-stage {
        display: flex;
        min-height: 450px;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(30px, 5vw, 60px);
        background:
          linear-gradient(rgba(98, 91, 161, 0.035) 1px, transparent 1px);
        background-size: 100% 42px;
      }

      .stage-label {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #8a91a1;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .stage-label::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #65c68d;
        box-shadow: 0 0 0 4px rgba(101, 198, 141, 0.13);
        content: "";
      }

      .reader-output {
        max-width: 680px;
        margin: 40px 0;
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
        font-size: clamp(25px, 3vw, 38px);
        line-height: 2.05;
        letter-spacing: 0.02em;
      }

      .reader-chunk {
        transition: color 160ms ease;
      }

      .reader-chunk--separated::before {
        display: inline-block;
        width: 0;
        height: 1em;
        margin: 0 0.08em;
        border-inline-start: var(--reader-divider-width, 3px) solid var(--reader-divider-color, #ff1744);
        vertical-align: -0.15em;
        filter: var(--reader-divider-filter, none);
        content: "";
      }

      .reader-output.is-plain {
        color: #7b8496;
      }

      .reader-output.is-plain .reader-chunk--separated::before {
        opacity: 0;
      }

      .stage-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
      }

      .stage-footer strong {
        color: #424c61;
        font-weight: 720;
      }

      @media (max-width: 880px) {
        .playground {
          grid-template-columns: 1fr;
        }

        .controls {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }

      @media (max-width: 620px) {
        .shell {
          width: min(100% - 24px, 1180px);
        }

        .site-header {
          height: 66px;
        }

        .hero {
          padding: 42px 4px 28px;
        }

        h1 {
          font-size: clamp(36px, 11vw, 48px);
        }

        .demo-section {
          padding-bottom: 44px;
        }

        .playground {
          border-radius: 20px;
        }

        .controls,
        .reader-stage {
          padding: 22px;
        }

        .reader-stage {
          min-height: 430px;
        }

        .reader-output {
          font-size: 25px;
        }

        .stage-footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 5px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header shell">
      <a class="brand" href="#" aria-label="Super Reader 首页">
        <span class="brand-mark" aria-hidden="true">阅</span>
        <span class="brand-name">Super Reader</span>
      </a>
    </header>

    <main>
      <section class="hero shell">
        <h1>看清句子的<em>停顿</em>。</h1>
        <p class="hero-copy">输入中文，立即查看分块效果。</p>
      </section>

      <section class="demo-section" id="demo">
        <div class="shell">
          <div class="playground">
            <aside class="controls" aria-label="阅读效果控制面板">
              <div class="control-top">
                <strong>视觉分块</strong>
                <label class="switch">
                  <input id="reader-toggle" type="checkbox" checked aria-label="开启视觉分块">
                  <span class="switch-track"></span>
                </label>
              </div>

              <div class="field">
                <label class="field-label" for="source-text">
                  <span>输入文本</span>
                </label>
                <textarea id="source-text" maxlength="240">真正高效的阅读并不是追求速度，而是帮助大脑更快地识别信息结构。</textarea>
              </div>

              <div class="field">
                <label class="field-label" for="divider-width">
                  <span>分割线粗细</span>
                  <output id="divider-output" for="divider-width">3 px</output>
                </label>
                <input id="divider-width" type="range" min="1" max="5" step="1" value="3">
              </div>

              <fieldset class="color-picker">
                <legend>分割线颜色</legend>
                <div class="color-options">
                  <label class="color-option" title="亮红">
                    <input type="radio" name="divider-color" value="red" checked>
                    <span class="color-swatch color-swatch--red" aria-hidden="true"></span>
                    <small>红</small>
                  </label>
                  <label class="color-option" title="亮黄">
                    <input type="radio" name="divider-color" value="yellow">
                    <span class="color-swatch color-swatch--yellow" aria-hidden="true"></span>
                    <small>黄</small>
                  </label>
                  <label class="color-option" title="亮蓝">
                    <input type="radio" name="divider-color" value="blue">
                    <span class="color-swatch color-swatch--blue" aria-hidden="true"></span>
                    <small>蓝</small>
                  </label>
                  <label class="color-option" title="亮绿">
                    <input type="radio" name="divider-color" value="green">
                    <span class="color-swatch color-swatch--green" aria-hidden="true"></span>
                    <small>绿</small>
                  </label>
                  <label class="color-option" title="跟随字体颜色">
                    <input type="radio" name="divider-color" value="text">
                    <span class="color-swatch color-swatch--text" aria-hidden="true"></span>
                    <small>字体</small>
                  </label>
                </div>
              </fieldset>

            </aside>

            <div class="reader-stage">
              <span class="stage-label">预览</span>
              <div id="reader-output" class="reader-output" aria-live="polite"></div>
              <footer class="stage-footer">
                <span id="chunk-count"><strong>5</strong> 个视觉块</span>
              </footer>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="src/boundary-model-data.js"></script>
    <script src="src/model-backend.js"></script>
    <script src="src/chunker.js?v=vertical-separators-2"></script>
    <script>
      (function initializeDemo() {
        "use strict";

        const sourceInput = document.querySelector("#source-text");
        const dividerInput = document.querySelector("#divider-width");
        const dividerOutput = document.querySelector("#divider-output");
        const dividerColorInputs = Array.from(document.querySelectorAll("[name='divider-color']"));
        const readerToggle = document.querySelector("#reader-toggle");
        const readerOutput = document.querySelector("#reader-output");
        const chunkCount = document.querySelector("#chunk-count");
        const segmenter = SuperReaderChunker.createSegmenter("zh-CN");
        const dividerColors = Object.freeze({
          red: "#ff1744",
          yellow: "#ffd600",
          blue: "#2979ff",
          green: "#00e676",
          text: "currentColor",
        });
        const coloredDividerFilter = [
          "drop-shadow(0.5px 0 0 rgba(255, 255, 255, 0.7))",
        ].join(" ");
        function render() {
          const text = sourceInput.value || "在左侧输入一段中文，看看它如何被重新组织。";
          const chunks = SuperReaderChunker.buildVisualChunks(text, {
            segmenter,
          });

          readerOutput.replaceChildren();
          readerOutput.style.setProperty(
            "--reader-divider-width",
            dividerInput.value + "px",
          );
          const selectedColorInput = dividerColorInputs.find(function isSelected(input) {
            return input.checked;
          });
          const colorName = selectedColorInput && dividerColors[selectedColorInput.value]
            ? selectedColorInput.value
            : "red";
          readerOutput.style.setProperty("--reader-divider-color", dividerColors[colorName]);
          readerOutput.style.setProperty(
            "--reader-divider-filter",
            colorName === "text" ? "none" : coloredDividerFilter,
          );
          dividerOutput.textContent = dividerInput.value + " px";
          chunks.forEach(function appendChunk(chunk) {
            if (!chunk.processed) {
              readerOutput.append(document.createTextNode(chunk.text));
              return;
            }

            const span = document.createElement("span");
            span.className = chunk.separated
              ? "reader-chunk reader-chunk--separated"
              : "reader-chunk";
            span.textContent = chunk.text;
            readerOutput.append(span);
          });

          const isEnabled = readerToggle.checked;
          const processedChunkCount = chunks.filter(function isProcessed(chunk) {
            return chunk.processed;
          }).length;
          readerOutput.classList.toggle("is-plain", !isEnabled);
          chunkCount.innerHTML = "<strong>" + (isEnabled ? processedChunkCount : 1) + "</strong> 个视觉块";
        }

        sourceInput.addEventListener("input", render);
        dividerInput.addEventListener("input", render);
        dividerColorInputs.forEach(function bindDividerColor(input) {
          input.addEventListener("change", render);
        });
        readerToggle.addEventListener("change", render);

        render();
      })();
    </script>
  </body>
</html>
