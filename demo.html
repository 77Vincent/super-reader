  <body>
    <h1></h1>
    <p>中文天然不使用空格切分语意块，而仅用标点断句。因此过长的的句子会破坏阅读体验。请感受本文里断句的出现是否让你的阅读更轻松。</p>
    <p><strong>切分阅读</strong>使用神经网络，在长句中找到符合人类习惯的断句点，把长句切成更短的语意块提升阅读效率。</p>
    <p>即便是完全符合语法的通顺的但没有任何标点断句的句子模型依然能够找到恰当的切分点。</p>
  </body>
