    <title>好读测试文章</title>
    <style>
      body { max-width: 720px; margin: 48px auto; padding: 0 24px; font: 20px/2 system-ui; }
    </style>
  </head>
  <body>
    <h1></h1>
    <p>过长的的句子会破坏阅读体验。请感受本文里断句的出现是否让你的阅读更轻松。</p>
    <p><strong>好读</strong>使用神经网络，在长句中找到符合人类习惯的断句点，把长句切成更短的语意块提升阅读效率。</p>
    <p>即便是完全符合语法的通顺的但没有任何标点断句的句子模型依然能够找到恰当的切分点。</p>
  </body>
